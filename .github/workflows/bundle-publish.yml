name: Bundle Publish

# Reusable workflow for publishing a simple envoy bundle.
#
# Produces a versioned zip (<bundle-name>-<version>.zip) with internal
# paths <bundle-name>/<version>/... so it can be extracted directly into
# any install root.
#
# Usage from a bundle's own build-release.yml:
#
#   jobs:
#     publish:
#       uses: <org>/<envoy-repo>/.github/workflows/reusable-bundle-publish.yml@main
#       with:
#         extra_excludes: 'myspec.spec pyproject.toml scripts'
#       secrets: inherit
#       permissions:
#         contents: write

on:
  workflow_call:
    inputs:
      extra_excludes:
        description: >
          Space-separated list of additional glob patterns to exclude from the
          publish zip (e.g. "myapp.spec pyproject.toml scripts"). These are
          passed as repeated --exclude arguments to engit publish.
        type: string
        required: false
        default: ''
      prerelease:
        description: >
          Controls the GitHub release prerelease flag.
          'auto' (default): detects from the tag name — suffixes matching
          alpha, beta, rc, preview, or dev are marked as prerelease; all
          other tags (including ext-style -envoy.N suffixes) are treated as
          production releases.
          'true': force prerelease regardless of tag name.
          'false': force production regardless of tag name.
        type: string
        required: false
        default: 'auto'
      runner:
        description: >
          JSON array of runner labels (e.g. '["self-hosted","Windows","X64"]').
          Defaults to the synology self-hosted runner.
        type: string
        required: false
        default: '["self-hosted", "X64", "Windows", "synology"]'
      namespace:
        description: >
          Bundle namespace prefix used to build the bndlid written into the
          .bundle marker file (e.g. 'gt' produces 'gt:<bundle-name>').
          Defaults to 'gt'.
        type: string
        required: false
        default: 'gt'

permissions:
  contents: write

jobs:
  publish:
    name: Create and upload publish zip
    runs-on: ${{ fromJson(inputs.runner) }}

    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build publish zip
        shell: pwsh
        run: |
          $version    = "${{ github.ref_name }}"
          $workspace  = $env:GITHUB_WORKSPACE
          $bundleName = Split-Path -Leaf $workspace
          $distDir    = Join-Path $workspace 'dist'
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # Patterns excluded by default (matched against each path component).
          $excludeDirs  = [System.Collections.Generic.HashSet[string]]@(
              '.git', '.gitignore', '.github', 'build', 'dist',
              '.pytest_cache', '__pycache__'
          )
          $excludeGlobs = @('*.pyc', '*.pyo', '*.pyd')

          # Merge extra excludes from workflow input.
          $extras = '${{ inputs.extra_excludes }}' -split '\s+' | Where-Object { $_ }
          foreach ($x in $extras) { $excludeDirs.Add($x) | Out-Null }

          $sep = [IO.Path]::DirectorySeparatorChar

          # Collect files, pruning excluded path components.
          $files = Get-ChildItem -Path $workspace -Recurse -File | Where-Object {
              $rel   = $_.FullName.Substring($workspace.Length).TrimStart($sep)
              $parts = $rel -split [regex]::Escape($sep)
              $skip  = $false
              foreach ($part in $parts) {
                  if ($excludeDirs.Contains($part)) { $skip = $true; break }
                  foreach ($glob in $excludeGlobs) {
                      if ($part -like $glob) { $skip = $true; break }
                  }
                  if ($skip) { break }
              }
              -not $skip
          }

          # Write versioned zip: <bundle>/<version>/<relative-path>
          $zipPath = Join-Path $distDir "$bundleName-$version.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, 'Create')
          try {
              foreach ($file in $files) {
                  $rel     = $file.FullName.Substring($workspace.Length).TrimStart($sep)
                  $arcName = ("$bundleName/$version/$rel").Replace('\', '/')
                  [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                      $zip, $file.FullName, $arcName, 'Optimal'
                  ) | Out-Null
              }

              # Write .bundle marker so envoy auto-discovery recognises this
              # as a production bundle when extracted (no .git/ present).
              $namespace  = '${{ inputs.namespace }}'
              $bndlid     = "$namespace`:$bundleName"
              $published  = (Get-Date -AsUTC).ToString('yyyy-MM-ddTHH:mm:ssZ')
              $markerJson = "{`n  `"bndlid`": `"$bndlid`",`n  `"name`": `"$bundleName`",`n  `"version`": `"$version`",`n  `"published`": `"$published`"`n}"
              $markerArc  = "$bundleName/$version/.bundle"
              $entry = $zip.CreateEntry($markerArc, 'Optimal')
              $writer = [System.IO.StreamWriter]::new($entry.Open())
              try { $writer.Write($markerJson) } finally { $writer.Dispose() }
          } finally {
              $zip.Dispose()
          }

          Write-Host "Published zip: $zipPath"

      - name: Resolve release type
        id: release_type
        shell: pwsh
        run: |
          $tag   = "${{ github.ref_name }}"
          $input = '${{ inputs.prerelease }}'
          if ($input -eq 'auto') {
              $isPrerelease = ($tag -match '-(alpha|beta|rc|preview|dev)(\.\d+)*$').ToString().ToLower()
          } else {
              $isPrerelease = $input
          }
          Write-Host "Tag: $tag  →  is_prerelease=$isPrerelease"
          echo "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          make_latest: ${{ steps.release_type.outputs.is_prerelease == 'false' }}
