[package]
name = "envoy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native envoy CLI dispatcher (no Python runtime dependency)."

[[bin]]
name = "envoy"
path = "src/main.rs"

[lib]
name = "envoy_cli"

[dependencies]
envoy-core = { path = "../envoy-core" }
clap.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
assert_cmd = "2"
