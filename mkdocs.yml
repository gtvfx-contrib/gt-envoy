site_name: Envoy
site_url: https://gtvfx-contrib.github.io/gt-envoy/
site_description: Environment orchestration for applications.
repo_name: gtvfx-contrib/gt-envoy
repo_url: https://github.com/gtvfx-contrib/gt-envoy
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Core Concepts: concepts.md
  - Environment Files: env-files.md
  - Bundle Discovery: bundle-discovery.md
  - Environment Modes: environment-modes.md
  - CLI Reference:
    - envoy: cli-reference/envoy.md
    - engit: cli-reference/engit.md
  - Python API: python-api.md
  - Examples: examples.md
  - Advanced Topics: advanced.md
  - Troubleshooting: troubleshooting.md
