name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/upload to releases

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: [self-hosted, X64, Windows, synology]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe` can derive the version from the tag

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Ensure Git Bash is on PATH
        # dtolnay/rust-toolchain's composite steps declare `shell: bash`.
        # GitHub-hosted Windows runners ship Git for Windows with its `bin`
        # dir already on PATH, so `bash` resolves for free. This self-hosted
        # Windows runner has Git for Windows installed (git.exe is used for
        # checkout above) but only `Git\cmd` is on PATH, not `Git\bin`/
        # `Git\usr\bin` where bash.exe and its POSIX utils live, so `bash`
        # otherwise fails with "command not found".
        shell: pwsh
        run: |
          $gitBashPaths = @(
            'C:\Program Files\Git\bin',
            'C:\Program Files\Git\usr\bin'
          ) | Where-Object { Test-Path $_ }

          if (-not $gitBashPaths) {
            throw "Git for Windows (bash.exe) not found on this runner; install it from https://gitforwindows.org/."
          }

          foreach ($path in $gitBashPaths) {
            Add-Content -Path $env:GITHUB_PATH -Value $path
          }

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install envoy (with docs extras)
        # Builds+installs the maturin-backed envoy-py wheel (compiling the
        # Rust extension via cargo, which the Rust toolchain step above set
        # up), so mkdocstrings can introspect its docstrings below.
        # envoy.__version__ is derived from `git describe` at build time via
        # rust/envoy-py/build.rs, independent of this install step.
        run: pip install .[docs]

      - name: Build documentation
        working-directory: ${{ github.workspace }}
        run: python -m properdocs build --clean

      - name: Build native executables
        # Replaces the old PyInstaller (envoy.spec) build: envoy-cli/engit-cli
        # are native Rust binaries with no bundled Python interpreter and no
        # PyInstaller step required. See rust/README.md.
        working-directory: ${{ github.workspace }}/rust
        run: cargo build --workspace --exclude envoy-py --release

      - name: Stage executables into dist/
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item rust\target\release\envoy.exe dist\envoy.exe -Force
          Copy-Item rust\target\release\engit.exe dist\engit.exe -Force

      - name: Verify executables
        run: |
          .\dist\envoy.exe --version
          .\dist\engit.exe --help

      - name: Build envoy Python wheel for release
        # The envoy-py (PyO3) wheel is now the distributed `envoy` Python
        # package (see pyproject.toml's maturin build-backend). Built
        # directly into dist/ so it's picked up by the release-upload step
        # below alongside the native executables.
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml --out dist

      - name: Create publish zip
        # Staged publish: copy only deployment-relevant items into a clean
        # staging directory, place EXEs into bin/ (replacing their bat
        # counterparts), then zip the result. en.bat is kept as a tiny alias
        # wrapper that calls envoy.exe directly.
        run: |
          $version   = "${{ github.ref_name }}"
          $workspace = "${{ github.workspace }}"
          $staging   = "$workspace\_publish_staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          foreach ($item in @('bin', '.envoy', 'LICENSE', 'README.md')) {
              $src = "$workspace\$item"
              if (Test-Path $src) {
                  Copy-Item $src "$staging\" -Recurse -Force
              }
          }

          # Include built documentation as docs/
          if (Test-Path "$workspace\site") {
              Copy-Item "$workspace\site" "$staging\docs" -Recurse -Force
          }

          # Remove bat launchers that are replaced by EXEs in the publish layout
          Remove-Item "$staging\bin\envoy.bat" -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\bin\engit.bat" -Force -ErrorAction SilentlyContinue

          # Place EXEs into bin/ (envoy.exe also serves as the target for en.bat)
          Copy-Item "$workspace\dist\envoy.exe" "$staging\bin\envoy.exe" -Force
          Copy-Item "$workspace\dist\engit.exe" "$staging\bin\engit.exe" -Force

          # Wrap staged contents in a versioned subdirectory so the zip has
          # internal paths gt/envoy/<version>/... matching the envoy bundle
          # naming convention (repo name segments → directory segments).
          $repoName    = "${{ github.event.repository.name }}"
          $publishPath = $repoName -replace '-', '/'
          $bndlid      = $repoName -replace '-', ':'
          $bndlName    = ($bndlid -split ':', 2)[1]
          $topDir      = ($publishPath -split '/')[0]

          $innerDir = Join-Path $staging ($publishPath.Replace('/', '\') + "\$version")
          New-Item -ItemType Directory -Path $innerDir -Force | Out-Null

          Get-ChildItem $staging | Where-Object { $_.Name -ne $topDir } |
              ForEach-Object { Move-Item $_.FullName $innerDir -Force }

          $published  = (Get-Date -AsUTC).ToString('yyyy-MM-ddTHH:mm:ssZ')
          $markerJson = "{`n  `"bndlid`": `"$bndlid`",`n  `"name`": `"$bndlName`",`n  `"version`": `"$version`",`n  `"published`": `"$published`"`n}"
          Set-Content -Path "$innerDir\.bundle" -Value $markerJson -Encoding UTF8

          $zipPath = "$workspace\dist\envoy-$version.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipPath
          Remove-Item $staging -Recurse -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/envoy.exe
            dist/engit.exe
            dist/envoy-*.whl
            dist/envoy-v*.zip
          fail_on_unmatched_files: true

  build-native-cross-platform:
    # Cross-platform build verification for the native Rust binaries. This
    # job does NOT (yet) produce release assets -- Linux/macOS distribution
    # of envoy/engit is not yet an established workflow (bin/*.bat, the
    # bundle-publish zip layout, etc. are still Windows-oriented) -- it only
    # confirms the Rust workspace builds cleanly on each platform, catching
    # cross-platform regressions early. Promote this to a real release
    # artifact once Linux/macOS distribution is actually needed.
    name: Build native binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build native executables
        working-directory: ${{ github.workspace }}/rust
        run: cargo build --workspace --exclude envoy-py --release

      - name: Verify executables
        working-directory: ${{ github.workspace }}/rust
        run: |
          ./target/release/envoy --version
          ./target/release/engit --help
