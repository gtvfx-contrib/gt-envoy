name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/upload to releases

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: [self-hosted, X64, Windows, synology]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so hatch-vcs can derive the version from the tag

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install envoy (editable) so hatch-vcs writes _version.py
        working-directory: ${{ github.workspace }}/py
        run: pip install -e ..

      - name: Build executables
        working-directory: ${{ github.workspace }}
        run: pyinstaller envoy.spec --noconfirm

      - name: Verify executables
        run: |
          .\dist\envoy.exe --version
          .\dist\engit.exe --help

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/envoy.exe
            dist/engit.exe
          fail_on_unmatched_files: true
