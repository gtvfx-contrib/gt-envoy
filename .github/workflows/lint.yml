name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (lint + format check)
    runs-on: ["self-hosted", "Linux", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install envoy with dev extras
        working-directory: ${{ github.workspace }}/py
        run: python -m pip install --upgrade pip && pip install -e ..[dev]

      - name: Run ruff check
        run: ruff check py

      - name: Run ruff format --check
        run: ruff format --check py

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ["self-hosted", "Linux", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        # envoy-py requires linking against a Python interpreter (pyo3) and
        # is built/tested separately via maturin (see build-release.yml),
        # not as part of this plain cargo workspace check.
        working-directory: rust
        run: cargo clippy --workspace --exclude envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

  rust-envoy-py:
    name: Rust envoy-py (fmt + clippy + test, PyO3)
    runs-on: ["self-hosted", "Linux", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check -p envoy-py

      - name: Run cargo clippy
        working-directory: rust
        run: cargo clippy -p envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build wheel with maturin
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml
