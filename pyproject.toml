[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "envoy"
version = "0.0.0"
requires-python = ">=3.10"
description = "Environment orchestration for managed application execution."
readme = "README.md"
license = { file = "LICENSE" }

[project.scripts]
# Backed by rust/envoy-py's cli_main() PyO3 binding, which delegates to the
# same envoy-cli library function as the native envoy.exe binary (see
# rust/envoy-py/src/cli.rs) -- so `pip install envoy` keeps providing an
# `envoy` command with no separate implementation to maintain.
envoy = "envoy:cli_main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]
docs = [
    "properdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[tool.maturin]
# Mixed Rust/Python layout: python/envoy/__init__.py re-exports symbols from
# the compiled extension built from rust/envoy-py/src/lib.rs (module name
# `envoy._envoy`). The actual wheel version is static here (0.0.0) --
# runtime `envoy.__version__` is derived from `git describe` at build time
# via rust/envoy-py/build.rs instead (see that file for rationale).
manifest-path = "rust/envoy-py/Cargo.toml"
python-source = "rust/envoy-py/python"
module-name = "envoy._envoy"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["rust/envoy-py/python", "rust/envoy-py/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "D",   # pydocstyle (docstring presence/structure)
    "UP",  # pyupgrade
]
ignore = [
    # This repo intentionally uses camelCase for function/method names (to
    # visually distinguish callables from variables) and snake_case for
    # @property methods. pep8-naming can't apply per-decorator exceptions,
    # so function/method naming is left unchecked here.
    "N802",
    # python/envoy/__init__.py re-exports the compiled extension's camelCase
    # functions as module-level aliases (e.g. `createWrapper =
    # _native.createWrapper`). pep8-naming sees these as global variables
    # (N816) rather than callables, but they're the same camelCase-function
    # convention as N802 above, just expressed via assignment instead of
    # `def`.
    "N816",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Missing-docstring rules are noisy for test fixtures.
"rust/envoy-py/tests/**" = ["D"]

[tool.ruff.format]
quote-style = "preserve"
