name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ruff:
    name: Ruff (lint + format check)
    runs-on: ["self-hosted", "Linux", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run ruff check
        run: ruff check scripts rust/envoy-py/python rust/envoy-py/tests

      - name: Run ruff format --check
        run: ruff format --check scripts rust/envoy-py/python rust/envoy-py/tests

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ["self-hosted", "Linux", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        # envoy-py requires linking against a Python interpreter (pyo3) and
        # is built/tested separately via maturin (see build-release.yml),
        # not as part of this plain cargo workspace check.
        working-directory: rust
        run: cargo clippy --workspace --exclude envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

  rust-envoy-py:
    name: Rust envoy-py (fmt + clippy + test, PyO3)
    runs-on: ["self-hosted", "Linux", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check -p envoy-py

      - name: Run cargo clippy
        working-directory: rust
        run: cargo clippy -p envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        # cc (the linker driver) needs an extra -L search path for
        # libpythonX.Y.so: this self-hosted runner's actions/setup-python
        # unpacks Python under its own tool-cache directory (exported as
        # $pythonLocation by the "Set up Python" step above), but the
        # Python build's own sysconfig LIBDIR is frozen at
        # /opt/hostedtoolcache/... (the path used on GitHub-hosted
        # runners), which doesn't exist here -- so pyo3-build-config's
        # -L flag points nowhere and linking envoy-py's test binary
        # against libpython fails. LIBRARY_PATH is read directly by cc/ld
        # as an additional search directory, independent of that guess.
        working-directory: rust
        run: LIBRARY_PATH="$pythonLocation/lib" cargo test -p envoy-py --lib

      - name: Build wheel with maturin
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml

      - name: Install built wheel + pytest
        run: |
          pip install pytest
          pip install --force-reinstall --no-index --find-links rust/target/wheels envoy

      - name: Run Python contract + consumer smoke tests against the wheel
        # These prove envoy-py's Python-facing behavior (not just that the
        # crate compiles/its own Rust unit tests pass) -- see
        # rust/envoy-py/tests/python_contract/README.md and
        # rust/envoy-py/tests/consumer_smoke/README.md for scope/rationale.
        run: python -m pytest rust/envoy-py/tests -v

  windows:
    name: Windows x64 tests
    runs-on: ["self-hosted", "Windows", "X64", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ensure Git Bash is on PATH
        shell: pwsh
        run: |
          $paths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\usr\bin') |
              Where-Object { Test-Path $_ }
          if (-not $paths) { throw 'Git Bash is required by the Rust toolchain action.' }
          foreach ($entry in $paths) { Add-Content -Path $env:GITHUB_PATH -Value $entry }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Test Rust Python bindings
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install maturin pytest
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml

      - name: Test installed wheel
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-index --find-links rust/target/wheels envoy
          python -m pytest rust/envoy-py/tests -v

  changes:
    name: Detect macOS-relevant changes
    runs-on: ["self-hosted", "Linux", "X64", "synology"]
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - "rust/**"
              - "bin/**"
              - "scripts/**"
              - ".envoy/**"
              - ".github/workflows/**"
              - "pyproject.toml"

  macos:
    name: macOS tests (${{ matrix.architecture }})
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Test Rust Python bindings
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build wheel
        run: |
          python3 -m pip install maturin pytest
          python3 -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml

      - name: Test installed wheel
        run: |
          python3 -m pip install --force-reinstall --no-index --find-links rust/target/wheels envoy
          python3 -m pytest rust/envoy-py/tests -v
