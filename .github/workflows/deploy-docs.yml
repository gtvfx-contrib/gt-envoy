name: Deploy Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy MkDocs site
    runs-on: ["self-hosted", "X64", "Windows", "synology"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MkDocs dependencies
        shell: pwsh
        run: |
          pip install mkdocs-material

      - name: Deploy to GitHub Pages
        shell: pwsh
        run: |
          mkdocs gh-deploy --force --clean
