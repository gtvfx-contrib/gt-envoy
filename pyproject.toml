[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "envoy"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Environment orchestration for managed application execution."
readme = "README.md"
license = { file = "LICENSE" }

[project.scripts]
envoy = "envoy._cli:main"
engit = "engit._cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]
docs = [
    "properdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Written automatically at install/build time — committed _version.py is not needed.
version-file = "py/envoy/_version.py"

[tool.hatch.build.targets.wheel]
# Package sources live under py/, not the project root.
packages = ["py/envoy", "py/engit"]
exclude = [
    "py/envoy/test_bundle",
    "py/envoy/examples",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "D",   # pydocstyle (docstring presence/structure)
    "UP",  # pyupgrade
]
ignore = [
    # This repo intentionally uses camelCase for function/method names (to
    # visually distinguish callables from variables) and snake_case for
    # @property methods. pep8-naming can't apply per-decorator exceptions,
    # so function/method naming is left unchecked here.
    "N802",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Missing-docstring rules are noisy for test fixtures and example scripts.
"py/envoy/test_bundle/**" = ["D"]
"py/envoy/examples/**" = ["D"]

[tool.ruff.format]
quote-style = "preserve"
