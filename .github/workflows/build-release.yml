name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/upload to releases

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: [self-hosted, X64, Windows, synology]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so hatch-vcs can derive the version from the tag

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install envoy (editable) so hatch-vcs writes _version.py
        working-directory: ${{ github.workspace }}/py
        run: pip install -e ..

      - name: Build executables
        working-directory: ${{ github.workspace }}
        run: pyinstaller envoy.spec --noconfirm

      - name: Verify executables
        run: |
          .\dist\envoy.exe --version
          .\dist\engit.exe --help

      - name: Create bundle zip
        # Zip the full repo including dist/ (which has the EXEs at this point,
        # before the wheel is added).  The bin/*.bat files already reference
        # dist\envoy.exe and dist\engit.exe relative to the bundle root, so
        # the extracted zip works as a drop-in bundle without modification.
        # Note: no .git/ in the zip means auto-discovery via ENVOY_BNDL_ROOTS
        # won't work; use --bundles-config to register the extracted bundle.
        run: |
          $version = "${{ github.ref_name }}"
          $workspace = "${{ github.workspace }}"
          $excludeDirs = @('build', '.git', '.pytest_cache')
          $items = Get-ChildItem -Path $workspace |
                   Where-Object { $excludeDirs -notcontains $_.Name }
          Compress-Archive -Path $items.FullName `
                           -DestinationPath "$workspace\dist\envoy-bundle-$version.zip"

      - name: Build Python wheel
        # pip wheel is used instead of python -m build for reliability.
        # --no-deps builds only the envoy wheel, not dependency wheels.
        # Runs after the bundle zip so the wheel is not included in the zip.
        working-directory: ${{ github.workspace }}
        run: pip wheel . -w dist --no-deps

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/envoy.exe
            dist/engit.exe
            dist/envoy-*.whl
            dist/envoy-bundle-*.zip
          fail_on_unmatched_files: true
