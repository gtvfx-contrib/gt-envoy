name: Publish Envoy Bundle

# Reusable workflow for publishing any Envoy bundle. Archive construction is
# performed by engit and is identical on Windows, Linux, and macOS. Artifact
# storage must already be mounted on Unix; Windows UNC roots can optionally be
# authenticated below.

on:
  workflow_call:
    inputs:
      extra_excludes:
        description: Space-separated additional exclude patterns
        type: string
        required: false
        default: ""
      prerelease:
        description: Prerelease policy (auto, true, or false)
        type: string
        required: false
        default: auto
      runner:
        description: JSON array of runner labels
        type: string
        required: false
        default: '["self-hosted", "X64", "Windows", "synology"]'
    secrets:
      ARTIFACTS_NAS_USER:
        description: Optional username for a Windows UNC artifact root
        required: false
      ARTIFACTS_NAS_PASS:
        description: Optional password for a Windows UNC artifact root
        required: false

permissions:
  contents: write

jobs:
  publish:
    name: Create and upload publish archive
    runs-on: ${{ fromJson(inputs.runner) }}

    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: bundle

      - name: Checkout Envoy publishing tools
        uses: actions/checkout@v4
        with:
          repository: gtvfx-contrib/gt-envoy
          ref: main
          path: envoy-tools

      - name: Ensure Git Bash is on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\usr\bin') |
              Where-Object { Test-Path $_ }
          if (-not $paths) { throw 'Git Bash is required by the Rust toolchain action.' }
          foreach ($entry in $paths) { Add-Content -Path $env:GITHUB_PATH -Value $entry }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache engit build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: envoy-tools/rust

      - name: Build engit
        working-directory: envoy-tools/rust
        run: cargo build -p engit-cli --release

      - name: Authenticate Windows UNC artifact root
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NAS_USER: ${{ secrets.ARTIFACTS_NAS_USER }}
          NAS_PASS: ${{ secrets.ARTIFACTS_NAS_PASS }}
        run: |
          $root = $env:ENVOY_STUDIO_ARTIFACTS
          if ($root -and $root -match '^\\\\([^\\]+)' -and $env:NAS_USER) {
              $server = $Matches[1]
              net use "\\$server" /user:"$env:NAS_USER" "$env:NAS_PASS" /persistent:no
              if ($LASTEXITCODE -ne 0) {
                  throw "net use failed mounting \\$server (exit $LASTEXITCODE)"
              }
          }

      - name: Validate Unix artifact root
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${ENVOY_STUDIO_ARTIFACTS:-}" && ! -d "$ENVOY_STUDIO_ARTIFACTS" ]]; then
            echo "ENVOY_STUDIO_ARTIFACTS must be mounted before this workflow runs." >&2
            exit 1
          fi

      - name: Publish bundle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $engit = Join-Path $env:GITHUB_WORKSPACE 'envoy-tools\rust\target\release\engit.exe'
          $arguments = @(
              'publish',
              (Join-Path $env:GITHUB_WORKSPACE 'bundle'),
              '--output', (Join-Path $env:GITHUB_WORKSPACE 'dist'),
              '--version', '${{ github.ref_name }}',
              '--zip'
          )
          foreach ($exclude in ('${{ inputs.extra_excludes }}' -split '\s+' | Where-Object { $_ })) {
              $arguments += @('--exclude', $exclude)
          }
          & $engit @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish bundle on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          engit="$GITHUB_WORKSPACE/envoy-tools/rust/target/release/engit"
          arguments=(
            publish "$GITHUB_WORKSPACE/bundle"
            --output "$GITHUB_WORKSPACE/dist"
            --version "${{ github.ref_name }}"
            --zip
          )
          read -r -a excludes <<< "${{ inputs.extra_excludes }}"
          for exclude in "${excludes[@]}"; do
            [[ -n "$exclude" ]] && arguments+=(--exclude "$exclude")
          done
          "$engit" "${arguments[@]}"

      - name: Resolve release type
        id: release_type
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          policy="${{ inputs.prerelease }}"
          if [[ "$policy" == "auto" ]]; then
            if [[ "$tag" =~ -(alpha|beta|rc|preview|dev)(\.[0-9]+)*$ ]]; then
              is_prerelease=true
            else
              is_prerelease=false
            fi
          else
            is_prerelease="$policy"
          fi
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          make_latest: ${{ steps.release_type.outputs.is_prerelease == 'false' }}
