name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/upload to releases

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: [self-hosted, X64, Windows, synology]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so hatch-vcs can derive the version from the tag

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller build

      - name: Install envoy (editable) so hatch-vcs writes _version.py
        working-directory: ${{ github.workspace }}/py
        run: pip install -e ..

      - name: Build executables
        working-directory: ${{ github.workspace }}
        run: pyinstaller envoy.spec --noconfirm

      - name: Verify executables
        run: |
          .\dist\envoy.exe --version
          .\dist\engit.exe --help

      - name: Build Python wheel
        # Run after PyInstaller so --noconfirm does not wipe the wheel.
        # python -m build --wheel appends to dist/ rather than clearing it.
        working-directory: ${{ github.workspace }}
        run: python -m build --wheel --outdir dist

      - name: Create bundle zip
        # Zip the full repo (minus dev/build artefacts) for teams that want
        # to use envoy as a discoverable bundle via --bundles-config.
        # Note: no .git/ in the zip means auto-discovery via ENVOY_BNDL_ROOTS
        # won't work; explicit --bundles-config is required.
        run: |
          $version = "${{ github.ref_name }}"
          $workspace = "${{ github.workspace }}"
          $excludeDirs = @('dist', 'build', '.git', '.pytest_cache')
          $items = Get-ChildItem -Path $workspace |
                   Where-Object { $excludeDirs -notcontains $_.Name }
          Compress-Archive -Path $items.FullName `
                           -DestinationPath "$workspace\dist\envoy-bundle-$version.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/envoy.exe
            dist/engit.exe
            dist/envoy-*.whl
            dist/envoy-bundle-*.zip
          fail_on_unmatched_files: true
